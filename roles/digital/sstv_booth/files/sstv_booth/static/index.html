<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSTV Booth</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="call" id="callsign">N0CALL</div>
    <div class="mode" id="sstv-mode">SSTV</div>
    <div class="spacer"></div>
    <div class="status" id="status"></div>
    <div class="badge" id="tx-badge">TX DISABLED</div>
  </header>

  <main id="stage">
    <img id="main-image" alt="">
    <div id="placeholder" class="placeholder">Listening for SSTV images&hellip;</div>
    <img id="preview" class="preview" alt="">
    <img id="review" class="review" alt="">
    <div id="countdown" class="countdown"></div>
    <div id="banner" class="banner"></div>
    <div id="prompt" class="prompt">Step on the pedal to send your selfie by radio!</div>
    <div id="txbar" class="txbar"><div id="txbar-fill"></div><span id="txbar-label"></span></div>
    <div id="toast" class="toast"></div>
  </main>

  <footer id="strip"></footer>

  <script src="/static/app.js"></script>
</body>
</html>
