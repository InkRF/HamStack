---
# Public configuration defaults for the cw_practice HamStack role.
# See docs/configuration.md for the configuration contract.
hamstack_cw_practice_enabled: false
hamstack_cw_practice_install_dir: /opt/hamstack/cw_practice
hamstack_cw_practice_callsign: '{{ hamstack_callsign | default(''N0CALL'') }}'
# iambic (tip = dit paddle, ring = dah paddle) or straight (tip = key).
hamstack_cw_practice_key_mode: iambic
hamstack_cw_practice_wpm: 15
hamstack_cw_practice_tone_hz: 600
# Browser KeyboardEvent.code values the page treats as dit and dah.
hamstack_cw_practice_dit_key: ControlLeft
hamstack_cw_practice_dah_key: ControlRight

# Raspberry Pi GPIO Morse-key input through the gpio-key device-tree overlay.
# Each contact is active low with the internal pull-up; wire the sleeve to GND.
hamstack_cw_practice_manage_gpio_key: false
hamstack_cw_practice_boot_config: /boot/firmware/config.txt
hamstack_cw_practice_tip_gpio: 17
hamstack_cw_practice_ring_gpio: 27
# Linux input keycodes: 29 = KEY_LEFTCTRL, 97 = KEY_RIGHTCTRL.
hamstack_cw_practice_tip_keycode: 29
hamstack_cw_practice_ring_keycode: 97
