---
- name: Manage CW practice page
  when: hamstack_cw_practice_enabled | bool
  block:
    - name: Verify CW practice inputs
      ansible.builtin.assert:
        that:
          - hamstack_cw_practice_key_mode in ['iambic', 'straight']
          - (hamstack_cw_practice_wpm | int) >= 5
          - (hamstack_cw_practice_wpm | int) <= 40
          - (hamstack_cw_practice_tip_gpio | int) != (hamstack_cw_practice_ring_gpio | int)
        fail_msg: >-
          CW practice needs key_mode iambic or straight, a speed of 5-40 WPM,
          and different GPIOs for the tip and ring contacts.

    - name: Create CW practice directory
      ansible.builtin.file:
        path: "{{ hamstack_cw_practice_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install CW practice page
      ansible.builtin.copy:
        src: index.html
        dest: "{{ hamstack_cw_practice_install_dir }}/index.html"
        owner: root
        group: root
        mode: "0644"

    - name: Render CW practice settings
      ansible.builtin.template:
        src: cw-config.js.j2
        dest: "{{ hamstack_cw_practice_install_dir }}/cw-config.js"
        owner: root
        group: root
        mode: "0644"

    - name: Check for Raspberry Pi boot configuration
      ansible.builtin.stat:
        path: "{{ hamstack_cw_practice_boot_config }}"
      register: _hamstack_cw_practice_boot_config

    - name: Require the Raspberry Pi boot configuration for GPIO keying
      ansible.builtin.assert:
        that:
          - _hamstack_cw_practice_boot_config.stat.exists
        fail_msg: >-
          {{ hamstack_cw_practice_boot_config }} was not found. GPIO Morse-key
          input needs Raspberry Pi firmware; set hamstack_cw_practice_boot_config
          or hamstack_cw_practice_manage_gpio_key: false.
      when: hamstack_cw_practice_manage_gpio_key | bool

    - name: Configure gpio-key overlays for the Morse key
      ansible.builtin.blockinfile:
        path: "{{ hamstack_cw_practice_boot_config }}"
        marker: "# {mark} HamStack digital/cw_practice Morse key"
        insertafter: EOF
        block: |
          [all]
          dtoverlay=gpio-key,gpio={{ hamstack_cw_practice_tip_gpio | int }},active_low=1,gpio_pull=up,keycode={{ hamstack_cw_practice_tip_keycode | int }},label=cw-tip
          dtoverlay=gpio-key,gpio={{ hamstack_cw_practice_ring_gpio | int }},active_low=1,gpio_pull=up,keycode={{ hamstack_cw_practice_ring_keycode | int }},label=cw-ring
      register: _hamstack_cw_practice_overlay
      when: hamstack_cw_practice_manage_gpio_key | bool

    - name: Report that a reboot is required for the Morse key overlay
      ansible.builtin.debug:
        msg: >-
          {{ hamstack_cw_practice_boot_config }} changed. Reboot for the Morse-key
          GPIO overlay to take effect; HamStack does not reboot.
      when: _hamstack_cw_practice_overlay is changed

    - name: Remove HamStack Morse key overlays when GPIO keying is disabled
      ansible.builtin.blockinfile:
        path: "{{ hamstack_cw_practice_boot_config }}"
        marker: "# {mark} HamStack digital/cw_practice Morse key"
        state: absent
      when:
        - not (hamstack_cw_practice_manage_gpio_key | bool)
        - _hamstack_cw_practice_boot_config.stat.exists
